<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="live-section">
      <label>Current Epoch</label>
      <div id="currentEpoch" class="live-counter">Loading...</div>
    </div>

    <hr>

    <div class="input-section">
      <label>Convert Timestamp</label>
      <input type="number" id="epochInput" placeholder="Paste epoch here...">
      <div id="result" class="result-box">---</div>
    </div>
    
    <p class="hint">Seconds & Milliseconds supported</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
