<!DOCTYPE html>
<!-- Dev Note: This was 100% Vibed -->
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="live-section">
      <label>Current Epoch</label>
      <div id="currentEpoch" class="live-counter">Loading...</div>
    </div>

    <div class="tabs">
      <button class="tab-link active" data-tab="to-date">To Date</button>
      <button class="tab-link" data-tab="to-epoch">To Epoch</button>
    </div>

    <hr>

    <div id="to-date" class="tab-content active">
      <label>Unix Timestamp</label>
      <input type="number" id="epochInput" placeholder="Enter epoch...">
      <div id="resultDate" class="result-box">---</div>
    </div>

    <div id="to-epoch" class="tab-content">
      <label>Select Date & Time</label>
      <input type="datetime-local" id="datePicker">
      <div id="resultEpoch" class="result-box">---</div>
    </div>

    <p class="hint">Local Timezone used for conversions</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
